name: Publicar municipios (cada 6 dias)
on:
  schedule:
    - cron: "0 12 6,12,18,24,30 * *"   # ~cada 6 dias 12:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl requests
          playwright install --with-deps chromium
      - name: Correr el monitor (grupo municipios)
        run: python inmobiliario.py publicar --carpeta data --grupo municipios
      - name: Guardar
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos municipios $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
