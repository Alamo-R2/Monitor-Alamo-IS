name: Publicar datos inmobiliarios

# CUÁNDO CORRE:
#  - Programado: todos los días 10:00 UTC (05:00 en Bogotá). Cambia el cron si quieres.
#  - Manual: pestaña "Actions" -> "Publicar datos inmobiliarios" -> "Run workflow" (Ejecutar ahora).
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para que el robot guarde la carpeta data/ en el repo

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl requests
          playwright install --with-deps chromium

      - name: Correr el monitor y publicar
        run: python inmobiliario.py publicar --carpeta data

      - name: Guardar los resultados en el repositorio
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos actualizados $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
