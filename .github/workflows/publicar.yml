name: Publicar datos inmobiliarios
on:
  schedule:
    - cron: "0 9 * * *"          # DIARIO 09:00 UTC (04:00 Bogota)
  workflow_dispatch:
    inputs:
      grupo:
        description: "Grupo a publicar"
        default: "diario"
        type: choice
        options: [diario, cada5, cada10, municipios]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl requests
          playwright install --with-deps chromium
      - name: Correr el monitor y publicar
        run: python inmobiliario.py publicar --carpeta data --grupo ${{ github.event.inputs.grupo || 'diario' }}
      - name: Guardar los resultados en el repositorio
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
