name: Prueba Fincaraiz (slugs)

# Descubre que slugs de tipo usa Fincaraiz (singular vs plural) y si sirve por barrio,
# ANTES de meterlo al motor de fases. Cero riesgo: solo lee y reporta conteos.
on:
  workflow_dispatch:
    inputs:
      operacion:
        description: "venta o arriendo"
        required: true
        default: "venta"

jobs:
  fincaraiz:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Probar Fincaraiz (tipos y barrio)
        run: |
          OP="${{ github.event.inputs.operacion }}"
          echo "| Prueba (tipo @ zona) | Resultados |" > fr.md
          echo "| --- | --- |" >> fr.md
          # pares "tipo:zona" — probamos singular y plural en una UPL, y un barrio
          for PAR in \
            "apartamento:chapinero" "apartamentos:chapinero" \
            "casa:chapinero" "casas:chapinero" \
            "oficina:chapinero" "oficinas:chapinero" \
            "bodega:chapinero" "bodegas:chapinero" \
            "local:chapinero" "locales:chapinero" \
            "lote:chapinero" "lotes:chapinero" \
            "apartamento:la-carolina" "apartamentos:la-carolina" ; do
            TIPO="${PAR%%:*}"; ZONA="${PAR##*:}"
            echo "=================================================="
            echo ">>> Fincaraiz  tipo=$TIPO  zona=$ZONA  op=$OP"
            echo "=================================================="
            SALIDA=$(python inmobiliario.py buscar --portal fincaraiz --zona "$ZONA" --operacion "$OP" --tipo "$TIPO" --paginas 1 2>&1 || true)
            echo "$SALIDA"
            N=$(echo "$SALIDA" | grep -ioE "resultados[^0-9]*[0-9]+" | grep -oE "[0-9]+" | tail -1)
            if [ -z "$N" ]; then N="?"; fi
            echo "| $TIPO @ $ZONA | $N |" >> fr.md
          done
          echo ""
          echo "############# RESUMEN FINCARAIZ #############"
          cat fr.md
          cat fr.md >> "$GITHUB_STEP_SUMMARY"
