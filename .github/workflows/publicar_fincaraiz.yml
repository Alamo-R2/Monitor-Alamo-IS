name: Publicar FincaRaiz (bootstrap barrios_res)

# Barre FincaRaiz (apartamento) sobre TODOS los barrios, con cursor propio
# (cursor_barrios_fincaraiz.json) y clave con prefijo "fincaraiz_" para NO chocar
# con metrocuadrado. Escribe archivos por-zona pequenos y fusiona el index.json
# (rolling, sin bloat). La app acumula el universo por upsert (v76_29).
#
# Cadencia de BOOTSTRAP: 6x/dia (cada ~4h), en horarios que NO pisan a metro
# (metro corre 07:00 barrios y 09:00 diario; municipios 12:00 dias puntuales).
# Al llenar la linea base (~4 dias), reduce la frecuencia (p.ej. dejar solo
# "0 5,18 * * *" = 2x/dia) o desactiva el workflow.

on:
  workflow_dispatch:
    inputs:
      barrios:
        description: "Barrios por corrida (80 = ~160 consultas, ~32 min)"
        default: "80"
      tipos:
        description: "Tipos (coma). Bootstrap: apartamento"
        default: "apartamento"
  schedule:
    - cron: "0 1,5,10,14,18,22 * * *"   # 6x/dia, escalonado fuera de las ventanas de metro

permissions:
  contents: write

concurrency:
  group: publicar-fincaraiz
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl requests
          playwright install --with-deps chromium

      - name: Correr FincaRaiz (residencial, todos los barrios, cursor propio)
        run: |
          python inmobiliario.py publicar \
            --carpeta data \
            --grupo barrios_res \
            --portal fincaraiz \
            --tipos "${{ github.event.inputs.tipos || 'apartamento' }}" \
            --cursor-suffix _fincaraiz \
            --barrios "${{ github.event.inputs.barrios || '80' }}"

      - name: Guardar (robusto ante corridas simultaneas de metro)
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "FincaRaiz barrios_res $(date -u '+%Y-%m-%d %H:%M UTC')"
          ok=0
          for i in $(seq 1 6); do
            if git pull --rebase --autostash origin main; then
              if git push origin HEAD:main; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/main 2>/dev/null || true
              echo "Conflicto con otra corrida; cedo esta vez. El cursor NO avanzo en remoto, se recupera en la siguiente corrida."
              exit 0
            fi
            echo "Reintento push $i..."; sleep $((RANDOM % 8 + 3))
          done
          [ "$ok" = "1" ] || { echo "No se pudo hacer push tras reintentos"; exit 1; }
