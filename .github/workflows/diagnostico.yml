name: Diagnostico portales
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl requests
          playwright install --with-deps chromium
      - name: Correr diagnostico
        run: python inmobiliario.py diagnostico --carpeta data
      - name: Guardar resultados
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/diagnostico
          git commit -m "Diagnostico" || echo "Sin cambios"
          git push
