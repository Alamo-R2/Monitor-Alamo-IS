name: Publicar cada 5 dias
on:
  schedule:
    - cron: "0 10 5,10,15,20,25,30 * *"   # ~cada 5 dias 10:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl requests
          playwright install --with-deps chromium
      - name: Correr el monitor (grupo cada5)
        run: python inmobiliario.py publicar --carpeta data --grupo cada5
      - name: Guardar
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos cada5 $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
